name: Update Political Intel Data

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour
  workflow_dispatch:      # Allow manual run

permissions:
  contents: write

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' 

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 lxml fake-useragent

    - name: Fetch and process news
      run: python projects/political-intel/fetch_news.py

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add projects/political-intel/data/news.json
        # Only commit if data/news.json has changed
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Political Intel data" && git push)
