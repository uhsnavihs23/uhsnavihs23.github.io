<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoliticalIntel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Karma:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/tools/political-intel/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="logo">Political<span>Intel</span></div>
        <div class="nav-links"><span id="last-updated">Updating...</span></div>
    </nav>
    <header class="hero">
        <h1>Intelligence Dashboard</h1>
        <p>Real-time tracking of developments, events, and Uttar Pradesh</p>
        <div class="mode-switcher">
            <button class="mode-btn active" onclick="switchMode('international')">International</button>
            <button class="mode-btn" onclick="switchMode('national')">National</button>
            <button class="mode-btn" onclick="switchMode('state')">UP Focus</button>
            <button class="mode-btn" onclick="switchMode('dashboard')">Dashboard</button>
        </div>
    </header>

    <section class="controls" id="filter-bar">
        <div class="filter-group">
            <label>Date:</label>
            <select id="grid-date"></select>
        </div>
        <div class="filter-group" id="district-group">
            <label>District:</label>
            <select id="district-filter"><option value="All">All Districts</option></select>
        </div>
        <div class="filter-group">
            <label>Topic:</label>
            <select id="category-filter">
                <option value="All">All Topics</option>
                <option value="Governance">Governance</option>
                <option value="Judicial">Judicial</option>
                <option value="Opposition">Opposition</option>
                <option value="Government">Government</option>
            </select>
        </div>
    </section>

    <section class="controls dashboard-controls" id="dashboard-bar" style="display: none;">
        <div class="filter-group"><label>Report Date:</label><select id="report-date"></select></div>
        <div class="action-buttons">
            <button onclick="printSelectablePDF()" class="pdf-btn print-btn">🖨️ Print / Save PDF</button>
            <button onclick="downloadAutoPDF()" class="pdf-btn auto-btn">⬇ Auto Report</button>
            <button onclick="toggleManualMode()" class="pdf-btn manual-btn">📝 Manual Selection</button>
        </div>
    </section>

    <main>
        <div id="news-grid" class="grid-container"><div class="loader">Loading Intelligence...</div></div>

        <div id="executive-report" class="report-container" style="display: none;">
            <div class="print-header-only">Internal Use Only</div>
            <div class="report-header">
                <h2 id="report-title">Daily Digest</h2>
                <p id="report-date-display">Date: ...</p>
                <hr style="border-top: 2px solid #333; margin-top: 10px; width: 100%;">
            </div>
            <div id="manual-controls" style="display:none; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px dashed #ccc;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <button onclick="selectAll(true)" class="link-btn">Select All</button> |
                        <button onclick="selectAll(false)" class="link-btn">Deselect All</button>
                    </div>
                    <button onclick="downloadManualPDF()" class="pdf-btn final-manual-btn">⬇ Generate Selected PDF</button>
                </div>
                <p style="font-size: 0.85em; color: #666; margin-top: 5px;">*Select checkboxes below to include in report</p>
            </div>
            <div id="report-content"></div>
            <div class="report-footer"><p>Generated by PoliticalIntel</p></div>
        </div>
    </main>
    <script src="/assets/tools/political-intel/script.js"></script>
</body>
</html>
