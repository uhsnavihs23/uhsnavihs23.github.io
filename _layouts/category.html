---
layout: default
---
<div class="post-content">
  <h2>{{ page.title }}</h2>
  <ul>
    {% assign cat = page.category %}
    {% for post in site.categories[cat] %}
      <li>
        <a href="{{ post.url }}">{{ post.title }}</a>
        <small> — {{ post.date | date: "%b %d, %Y" }}</small>
      </li>
    {% endfor %}
  </ul>
</div>
