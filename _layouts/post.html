---
layout: default
---

<article class="post">
    <header>
        <h1>{{ page.title }}</h1>
        <div class="post-meta text-muted">
            <span>Posted <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%b %-d, %Y'
                    }}</time></span>
            <!-- {% if page.last_modified_at %}
            <span>Updated <time datetime="{{ page.last_modified_at | date_to_xmlschema }}">{{ page.last_modified_at |
                    date: '%b %-d, %Y' }}</time></span>
            {% endif %} -->
            <span>By <em><a href="https://uhsnavihs23.github.io">Shivanshu Sharma</a></em></span>
        </div>
    </header>

    <div class="post-content">
        {{ content }}
    </div>
</article>
