<style>
    /* UNIVERSAL THEME VARIABLES */
    :root {
        --bg-color: #f9fafb;
        --card-bg: #ffffff;
        --text-primary: #0f172a;
        --text-secondary: #475569;
        --border-color: #e5e7eb;
        --accent-color: #3b82f6;
        --nav-bg: rgba(255, 255, 255, 0.8);
    }
    html.dark {
        --bg-color: #18181b;
        --card-bg: #27272a;
        --text-primary: #f4f4f5;
        --text-secondary: #d4d4d8;
        --border-color: #3f3f46;
        --accent-color: #2dd4bf;
        --nav-bg: rgba(24, 24, 27, 0.8);
    }
    
    /* GLOBAL OVERRIDES FOR TAILWIND HARDCODED CLASSES */
    html.dark body { background-color: var(--bg-color) !important; color: var(--text-primary) !important; }
    html.dark .bg-white { background-color: var(--card-bg) !important; }
    html.dark .bg-gray-50, html.dark .bg-slate-50 { background-color: var(--bg-color) !important; }
    html.dark .text-gray-900, html.dark .text-gray-800, html.dark .text-slate-900, html.dark .text-slate-800, html.dark .text-black { color: var(--text-primary) !important; }
    html.dark .text-gray-700, html.dark .text-gray-600, html.dark .text-gray-500, html.dark .text-slate-700, html.dark .text-slate-600, html.dark .text-slate-500 { color: var(--text-secondary) !important; }
    html.dark .border-gray-200, html.dark .border-gray-300, html.dark .border-slate-200, html.dark .border-slate-300 { border-color: var(--border-color) !important; }
    
    /* COMPATIBILITY OVERRIDES FOR INLINE STYLES AND CUSTOM CSS (Campus Electricity) */
    html.dark .header, html.dark .intro-card, html.dark .kpi-card, html.dark .chart-card, html.dark .impact-card, html.dark .recommendation-card, html.dark .warning-card { 
        background-color: var(--card-bg) !important; 
        border-color: var(--border-color) !important;
    }
    html.dark .header { background: var(--card-bg) !important; }
    html.dark .header h1, html.dark .header-badge, html.dark h2, html.dark h3, html.dark h4, html.dark .kpi-value, html.dark .rec-title { color: var(--text-primary) !important; }
    html.dark .header p, html.dark p, html.dark .kpi-label, html.dark .rec-description, html.dark .rec-detail-label { color: var(--text-secondary) !important; }
    
    /* OVERRIDES FOR TAILWIND PROSE */
    html.dark .prose h1, html.dark .prose h2, html.dark .prose h3, html.dark .prose h4 { color: var(--text-primary) !important; }
    html.dark .prose p, html.dark .prose li, html.dark .prose span { color: var(--text-secondary) !important; }
    
    /* OVERRIDES FOR HEADER SPECIFICALLY */
    html.dark header.bg-white\/80 { background-color: var(--nav-bg) !important; }
    
    /* ANY ELEMENT WITH WHITE BG IN DARK MODE */
    html.dark [style*="background: white"], html.dark [style*="background-color: white"], html.dark [style*="background-color: #ffffff"] { background-color: var(--card-bg) !important; }
    html.dark [style*="color: #111827"], html.dark [style*="color: #0f172a"] { color: var(--text-primary) !important; }
    html.dark [style*="color: #4b5563"], html.dark [style*="color: #6b7280"] { color: var(--text-secondary) !important; }

    /* DYNAMIC LIGHT-BOX COLOR OVERRIDES FOR DARK THEME */
    html.dark .bg-amber-100, html.dark .bg-amber-50 { background-color: rgba(245, 158, 11, 0.15) !important; color: #fcd34d !important; }
    html.dark .bg-blue-100, html.dark .bg-blue-50 { background-color: rgba(59, 130, 246, 0.15) !important; color: #93c5fd !important; border-color: rgba(59, 130, 246, 0.3) !important; }
    html.dark .bg-emerald-100, html.dark .bg-emerald-50 { background-color: rgba(16, 185, 129, 0.15) !important; color: #6ee7b7 !important; border-color: rgba(16, 185, 129, 0.3) !important; }
    html.dark .bg-gray-100, html.dark .bg-gray-50, html.dark .bg-slate-100, html.dark .bg-slate-50 { background-color: var(--card-bg) !important; color: var(--text-primary) !important; border: 1px solid var(--border-color) !important; }
    html.dark .bg-indigo-100, html.dark .bg-indigo-50 { background-color: rgba(99, 102, 241, 0.15) !important; color: #a5b4fc !important; border-color: rgba(99, 102, 241, 0.3) !important; }
    html.dark .bg-red-100, html.dark .bg-red-50 { background-color: rgba(239, 68, 68, 0.15) !important; color: #fca5a5 !important; border-color: rgba(239, 68, 68, 0.3) !important; }
    html.dark .bg-yellow-100, html.dark .bg-yellow-50 { background-color: rgba(234, 179, 8, 0.15) !important; color: #fde047 !important; border-color: rgba(234, 179, 8, 0.3) !important; }
    html.dark .bg-orange-100, html.dark .bg-orange-50 { background-color: rgba(249, 115, 22, 0.15) !important; color: #fdba74 !important; border-color: rgba(249, 115, 22, 0.3) !important; }
    html.dark .bg-purple-100, html.dark .bg-purple-50 { background-color: rgba(168, 85, 247, 0.15) !important; color: #d8b4fe !important; border-color: rgba(168, 85, 247, 0.3) !important; }
    html.dark .bg-teal-100, html.dark .bg-teal-50 { background-color: rgba(20, 184, 166, 0.15) !important; color: #5eead4 !important; border-color: rgba(20, 184, 166, 0.3) !important; }
    html.dark .bg-green-100, html.dark .bg-green-50 { background-color: rgba(34, 197, 94, 0.15) !important; color: #86efac !important; border-color: rgba(34, 197, 94, 0.3) !important; }
    
    /* OVERRIDE TEXT COLORS INSIDE DYNAMIC BOXES TO PREVENT CLASHING */
    html.dark .bg-amber-100 *, html.dark .bg-amber-50 * { color: inherit !important; }
    html.dark .bg-blue-100 *, html.dark .bg-blue-50 * { color: inherit !important; }
    html.dark .bg-emerald-100 *, html.dark .bg-emerald-50 * { color: inherit !important; }
    html.dark .bg-indigo-100 *, html.dark .bg-indigo-50 * { color: inherit !important; }
    html.dark .bg-red-100 *, html.dark .bg-red-50 * { color: inherit !important; }
    html.dark .bg-yellow-100 *, html.dark .bg-yellow-50 * { color: inherit !important; }
    html.dark .bg-orange-100 *, html.dark .bg-orange-50 * { color: inherit !important; }
    html.dark .bg-purple-100 *, html.dark .bg-purple-50 * { color: inherit !important; }
    html.dark .bg-teal-100 *, html.dark .bg-teal-50 * { color: inherit !important; }
    html.dark .bg-green-100 *, html.dark .bg-green-50 * { color: inherit !important; }


    /* DYNAMIC INLINE HEX-COLOR OVERRIDES FOR DARK THEME (e.g. Campus Electricity) */
    html.dark [style*="#dbeafe" i] { background-color: rgba(59, 130, 246, 0.15) !important; border-color: rgba(59, 130, 246, 0.3) !important; color: #93c5fd !important; }
    html.dark [style*="#f0fdf4" i] { background-color: rgba(16, 185, 129, 0.15) !important; border-color: rgba(16, 185, 129, 0.3) !important; color: #6ee7b7 !important; }
    html.dark [style*="#fefce8" i] { background-color: rgba(234, 179, 8, 0.15) !important; border-color: rgba(234, 179, 8, 0.3) !important; color: #fde047 !important; }
    html.dark [style*="#f3f4f6" i], html.dark [style*="#f9fafb" i] { background-color: var(--card-bg) !important; border-color: var(--border-color) !important; color: var(--text-primary) !important; }
    
    html.dark [style*="#dbeafe" i] *, html.dark [style*="#f0fdf4" i] *, html.dark [style*="#fefce8" i] *, html.dark [style*="#f3f4f6" i] *, html.dark [style*="#f9fafb" i] * { color: inherit !important; }
    
    /* FIX HOVER STATES FOR THE TABLE/ROWS IN DARK MODE */
    html.dark tr:hover { background-color: rgba(255,255,255,0.05) !important; }


    
    
    
    
    /* GO RETRO BETA FEATURE (Consistent Full-Screen IE6) */
    html.retro body {
        font-family: Tahoma, "Microsoft Sans Serif", sans-serif !important;
        background-color: #ffffff !important;
        color: #000000 !important;
        padding-top: 135px !important; /* Room for IE Chrome Top */
        padding-bottom: 25px !important; /* Room for IE Chrome Bottom */
        margin: 0 !important;
    }
    
    /* Hide modern header entirely */
    html.retro header { display: none !important; }
    
    /* Do not mess with main/margins so layouts don't break! */
    html.retro main {
        background-color: transparent !important;
        border: none !important;
        box-shadow: none !important;
    }
    
    html.retro footer {
        background: transparent !important;
        border: none !important;
        margin-bottom: 10px !important;
    }
    
    html.retro h1, html.retro h2, html.retro h3, html.retro h4 { font-family: "Times New Roman", Times, serif !important; color: #000000 !important; }
    html.retro p, html.retro span, html.retro div { color: inherit; }
    html.retro a { color: #0000EE !important; text-decoration: underline !important; }
    html.retro a:hover { color: #FF0000 !important; }
    
    html.retro .bg-cardBg, html.retro .bg-white, html.retro [style*="background-color: var(--card-bg)"] {
        background: #ffffff !important;
        border: 1px solid #000000 !important;
        box-shadow: none !important;
        border-radius: 0 !important;
    }
    
    html.retro button {
        background: #ece9d8 !important;
        border: 2px outset #ffffff !important;
        border-right-color: #aca899 !important;
        border-bottom-color: #aca899 !important;
        color: #000000 !important;
        font-family: Tahoma, sans-serif !important;
        border-radius: 0 !important;
        box-shadow: none !important;
    }
    html.retro button:active { border-style: inset !important; }

    
    
    /* DARK THEME RETRO MODE CONSISTENCY (High Contrast Black style) */
    html.dark.retro body {
        background-color: #000000 !important;
        color: #ffffff !important;
    }
    
    /* Apply black background to everything EXCEPT the fake IE chrome */
    html.dark.retro main, html.dark.retro footer, html.dark.retro section, 
    html.dark.retro main div, html.dark.retro footer div, html.dark.retro section div {
        background-color: #000000 !important;
        color: #ffffff !important;
        border-color: #ffffff !important;
    }
    
    html.dark.retro a { color: #ffff00 !important; }
    html.dark.retro a:hover { color: #ff0000 !important; }
    html.dark.retro h1, html.dark.retro h2, html.dark.retro h3, html.dark.retro h4 { color: #00ff00 !important; }
    
    html.dark.retro .bg-cardBg, html.dark.retro .bg-white, html.dark.retro [style*="background"] {
        background-color: #000000 !important;
    }
    
    /* We MUST protect the IE chrome from these dark mode overrides */
    html.dark.retro #ie-chrome-top, 
    html.dark.retro #ie-chrome-bottom,
    html.dark.retro #ie-chrome-top *, 
    html.dark.retro #ie-chrome-bottom * {
        background-color: inherit;
        color: inherit;
        border-color: inherit;
    }
    html.dark.retro #ie-chrome-top input {
        background-color: #ffffff !important;
        color: #000000 !important;
    }
    
    /* Apply black background to everything EXCEPT the fake IE chrome */
    html.dark.retro main, html.dark.retro footer, html.dark.retro section, 
    html.dark.retro main div, html.dark.retro footer div, html.dark.retro section div {
        background-color: #000000 !important;
        color: #ffffff !important;
        border-color: #ffffff !important;
    }
    
    html.dark.retro a { color: #ffff00 !important; }
    html.dark.retro a:hover { color: #ff0000 !important; }
    html.dark.retro h1, html.dark.retro h2, html.dark.retro h3, html.dark.retro h4 { color: #00ff00 !important; }
    
    html.dark.retro .bg-cardBg, html.dark.retro .bg-white, html.dark.retro [style*="background"] {
        background-color: #000000 !important;
    }
    
    /* We MUST protect the IE chrome from these dark mode overrides */
    html.dark.retro #ie-chrome-top [style*="background"], html.dark.retro #ie-chrome-bottom [style*="background"] {
        /* let inline styles win */
    }


    
    /* Global fixes for relative paths in fake IE nav */
    html.retro #ie-chrome-top a { text-decoration: none !important; color: #000 !important; }
    html.retro #ie-chrome-top a:hover { background: #c1d2ee !important; }

</style>

<script>
  const newsDataKey = "{{ site.newsdata_api_key }}";
  const internationalNewsDiv = document.getElementById("internationalNews");
  const regionalNewsDiv = document.getElementById("regionalNews");
  const tickerDiv = document.getElementById("ticker");
  const regionSelect = document.getElementById("regionSelect");
  const categorySelect = document.getElementById("categorySelect");
  const internationalBtn = document.getElementById("internationalBtn");
  const regionalBtn = document.getElementById("regionalBtn");
  const modal = document.getElementById("newsModal");
  const modalContent = document.getElementById("modalContent");
  const lastUpdated = document.getElementById("lastUpdated");
  const loadingDiv = document.getElementById("loading");

  const rssUrls = {
    in: [
      "https://www.theguardian.com/world/india/rss",
      "http://feeds.reuters.com/reuters/INtopNews",
      "https://feeds.bbci.co.uk/news/world/asia/india/rss.xml"
    ],
    us: [
      "https://www.theguardian.com/us-news/rss",
      "http://feeds.reuters.com/Reuters/domesticNews",
      "https://feeds.bbci.co.uk/news/world/us_and_canada/rss.xml"
    ],
    gb: [
      "https://www.theguardian.com/uk/rss",
      "http://feeds.reuters.com/Reuters/UKdomestic",
      "https://feeds.bbci.co.uk/news/uk/rss.xml"
    ],
    ca: ["https://feeds.bbci.co.uk/news/world/us_and_canada/rss.xml"],
    au: ["https://www.theguardian.com/australia-news/rss"],
    fr: ["https://www.theguardian.com/world/france/rss"],
    de: ["https://www.theguardian.com/world/germany/rss"],
    ae: ["https://www.theguardian.com/world/middleeast/rss"],
    default: [
      "https://www.theguardian.com/world/rss",
      "http://feeds.reuters.com/reuters/topNews",
      "https://feeds.bbci.co.uk/news/world/rss.xml"
    ]
  };

  const breakingRss = [
    "https://www.theguardian.com/world/rss",
    "http://feeds.reuters.com/reuters/topNews"
  ];

  let allArticles = [];
  let currentMode = "international";
  let currentCategory = "general";
  let tickerItems = [];
  let tickerIndex = 0;

  function debounce(func, wait) {
    let timeout;
    return function executedFunction(...args) {
      const later = () => {
        clearTimeout(timeout);
        func(...args);
      };
      clearTimeout(timeout);
      timeout = setTimeout(later, wait);
    };
  }

  async function updateTicker() {
    tickerItems = [];
    try {
      console.log("Fetching breaking news from NewsData.io");
      const response = await fetch(`https://newsdata.io/api/1/latest?category=top&language=en&size=10&apikey=${newsDataKey}`);
      if (!response.ok) throw new Error(`NewsData.io error! Status: ${response.status}`);
      const data = await response.json();
      if (data.results) {
        tickerItems = data.results.map(item => item.title).filter(title => isEnglish(title));
      }
    } catch (error) {
      console.error("NewsData.io breaking news failed:", error);
    }

    for (const rssUrl of breakingRss) {
      try {
        const response = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`);
        if (response.ok) {
          const data = await response.json();
          if (data.items) {
            tickerItems = [...tickerItems, ...data.items.map(item => item.title).filter(title => isEnglish(title))];
          }
        }
      } catch (error) {
        console.error("RSS breaking news failed:", rssUrl, error);
      }
    }

    tickerItems = [...new Set(tickerItems)];
    tickerIndex = 0;
    displayTicker();
  }

  function displayTicker() {
    if (tickerItems.length === 0) {
      tickerDiv.textContent = "No breaking news available.";
      return;
    }
    tickerDiv.textContent = tickerItems[tickerIndex];
    tickerIndex = (tickerIndex + 1) % tickerItems.length;
    setTimeout(displayTicker, 6000);
  }

  function isEnglish(text) {
    if (!text) return false;
    return /^[A-Za-z0-9\s.,!?&'()-]+$/.test(text.replace(/<[^>]+>/g, ""));
  }

  function normalizeTitle(title) {
    return title ? title.toLowerCase().trim().replace(/\s+/g, " ") : "";
  }

  function updateTimestamp() {
    const now = new Date();
    const istOptions = { timeZone: "Asia/Kolkata", hour12: true, hour: "numeric", minute: "2-digit", second: "2-digit", day: "2-digit", month: "short", year: "numeric" };
    lastUpdated.textContent = now.toLocaleString("en-IN", istOptions);
  }

  function displayNews(articles, container) {
    const seenTitles = new Set();
    allArticles = articles
      .filter(article => {
        const normalized = normalizeTitle(article.title);
        if (seenTitles.has(normalized) || !isEnglish(article.title)) {
          return false;
        }
        seenTitles.add(normalized);
        return true;
      })
      .slice(0, 50);

    container.innerHTML = "";
    if (allArticles.length === 0) {
      container.innerHTML = "<p>No news available at this time.</p>";
      loadingDiv.style.display = "none";
      return;
    }

    allArticles.forEach(article => {
      const card = document.createElement("div");
      card.className = "news-card";
      card.onclick = () => showFullArticle(article);
      card.innerHTML = `
        <article itemscope itemtype="http://schema.org/NewsArticle">
          <h3 itemprop="headline">${article.title}</h3>
          <meta itemprop="datePublished" content="${article.publishedAt}">
          <meta itemprop="publisher" content="${article.source.name}">
        </article>
      `;
      container.appendChild(card);
    });

    loadingDiv.style.display = "none";
  }

  async function fetchInternationalNews() {
    updateTimestamp();
    loadingDiv.style.display = "block";
    let articles = [];

    try {
      console.log("Fetching international news, category:", currentCategory);
      const response = await fetch(`https://newsdata.io/api/1/news?q=international&category=${currentCategory === 'defense' ? 'world' : currentCategory}&language=en&size=50&apikey=${newsDataKey}`);
      if (!response.ok) throw new Error(`NewsData.io error! Status: ${response.status}`);
      const data = await response.json();
      console.log("NewsData.io international data:", data);
      if (data.results && data.results.length > 0) {
        articles = data.results.map(item => ({
          title: item.title,
          description: item.description || "",
          source: { name: item.source_id || "Unknown" },
          publishedAt: item.pubDate || new Date().toISOString(),
          content: item.content || item.description,
          url: item.link
        }));
      }
    } catch (error) {
      console.error("NewsData.io international failed:", error);
    }

    if (articles.length < 50) {
      articles = [...articles, ...await fetchInternationalNewsRSS()];
    }

    displayNews(articles, internationalNewsDiv);
    return articles;
  }

  async function fetchRegionalNews() {
    updateTimestamp();
    loadingDiv.style.display = "block";
    const country = regionSelect.value;
    let articles = [];

    try {
      console.log("Fetching regional news for country:", country, "category:", currentCategory);
      const response = await fetch(`https://newsdata.io/api/1/news?country=${country}&category=${currentCategory === 'defense' ? 'world' : currentCategory}&language=en&size=50&apikey=${newsDataKey}`);
      if (!response.ok) throw new Error(`NewsData.io error! Status: ${response.status}`);
      const data = await response.json();
      console.log("NewsData.io regional data:", data);
      if (data.results && data.results.length > 0) {
        articles = data.results.map(item => ({
          title: item.title,
          description: item.description || "",
          source: { name: item.source_id || "Unknown" },
          publishedAt: item.pubDate || new Date().toISOString(),
          content: item.content || item.description,
          url: item.link
        }));
      }
    } catch (error) {
      console.error("NewsData.io regional failed for country:", country, error);
    }

    if (articles.length < 50) {
      articles = [...articles, ...await fetchRegionalNewsRSS(country)];
    }

    displayNews(articles, regionalNewsDiv);
    return articles;
  }

  async function fetchNewsByCategory() {
    currentCategory = categorySelect.value;
    console.log("Category changed to:", currentCategory);
    if (currentMode === "international") {
      await fetchInternationalNews();
    } else {
      await fetchRegionalNews();
    }
  }

  const debounceFetchRegionalNews = debounce(fetchRegionalNews, 500);

  async function fetchInternationalNewsRSS() {
    updateTimestamp();
    let articles = [];
    const feeds = rssUrls.default;
    for (const rssUrl of feeds) {
      try {
        console.log("Trying RSS feed for international news:", rssUrl);
        const response = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`);
        if (!response.ok) throw new Error(`RSS error! Status: ${response.status}`);
        const data = await response.json();
        console.log("RSS international data:", data);
        if (data.items && data.items.length > 0) {
          articles = [...articles, ...data.items
            .filter(item => isEnglish(item.title) && isEnglish(item.description || ""))
            .map(item => ({
              title: item.title,
              description: item.description || "",
              source: { name: data.feed.title || "Unknown" },
              publishedAt: item.pubDate || new Date().toISOString(),
              content: item.content || item.description,
              url: item.link
            }))];
        }
      } catch (error) {
        console.error("RSS international failed for:", rssUrl, error);
      }
    }
    return articles;
  }

  async function fetchRegionalNewsRSS(country) {
    updateTimestamp();
    let articles = [];
    const feeds = rssUrls[country] || rssUrls.default;
    for (const rssUrl of feeds) {
      try {
        console.log("Trying RSS feed for regional news:", rssUrl);
        const response = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`);
        if (!response.ok) throw new Error(`RSS error! Status: ${response.status}`);
        const data = await response.json();
        console.log("RSS regional data:", data);
        if (data.items && data.items.length > 0) {
          articles = [...articles, ...data.items
            .filter(item => isEnglish(item.title) && isEnglish(item.description || ""))
            .map(item => ({
              title: item.title,
              description: item.description || "",
              source: { name: data.feed.title || "Unknown" },
              publishedAt: item.pubDate || new Date().toISOString(),
              content: item.content || item.description,
              url: item.link
            }))];
        }
      } catch (error) {
        console.error("RSS regional failed for:", rssUrl, error);
      }
    }
    return articles;
  }

  function showFullArticle(article) {
    const cleanContent = (article.content || article.description || "Full content not available.")
      .replace(/\[.*?\]/g, "")
      .replace(/<[^>]+>/g, "");
    modalContent.innerHTML = `
      <h2 itemprop="headline">${article.title}</h2>
      <p class="source"><strong>Source:</strong> ${article.source.name}</p>
      <p class="published"><strong>Published:</strong> ${new Date(article.publishedAt).toLocaleDateString("en-IN", { timeZone: "Asia/Kolkata" })}</p>
      <p itemprop="articleBody">${cleanContent}</p>
      <a href="${article.url}" target="_blank" class="article-link" itemprop="url">Read Original Article</a>
    `;
    modal.style.display = "flex";
  }

  function closeModal() {
    modal.style.display = "none";
  }

  function showInternational() {
    currentMode = "international";
    internationalNewsDiv.style.display = "block";
    regionalNewsDiv.style.display = "none";
    regionSelect.style.display = "none";
    internationalBtn.classList.add("active");
    regionalBtn.classList.remove("active");
    fetchInternationalNews();
  }

  function showRegional() {
    currentMode = "regional";
    internationalNewsDiv.style.display = "none";
    regionalNewsDiv.style.display = "block";
    regionSelect.style.display = "inline-block";
    internationalBtn.classList.remove("active");
    regionalBtn.classList.add("active");
    debounceFetchRegionalNews();
  }

  if (!newsDataKey) {
    console.error("NewsData.io API key is missing!");
    internationalNewsDiv.innerHTML = "<p>Error: API key is missing in configuration.</p>";
    fetchInternationalNewsRSS();
  } else {
    fetchInternationalNews();
    updateTicker();
  }

  window.onclick = (event) => {
    if (event.target === modal) {
      closeModal();
    }
  };
</script>

        function setTheme(isDark) {

                if(themeIconDark) themeIconDark.style.display = 'none';

                if(themeIconLight) themeIconLight.style.display = 'none';
                if(themeIconDark) themeIconDark.style.display = 'block';
                localStorage.setItem('theme', 'light');
            }
        }
        if (localStorage.getItem('theme') === 'dark') { setTheme(true); } else { setTheme(false); }
        if (themeToggle) { themeToggle.addEventListener('click', () => { setTheme(!html.classList.contains('dark')); }

        
        
        


); }
