<div class="pb-container">
  <p class="pb-subtitle">Enter a policy topic to generate a structured brief from live Indian news headlines.</p>

  <div class="pb-input-row">
    <input type="text" id="topicInput" placeholder="e.g. Urban water crisis UP, Agricultural MSP, EV policy India" />
    <button class="pb-btn" id="generateBtn" onclick="generateBrief()">Generate Brief</button>
  </div>

  <div class="pb-error" id="errorMsg"></div>
  <div class="pb-status" id="statusMsg"></div>

  <div class="brief-box" id="briefBox">
    <div class="brief-header">
      <div class="brief-title" id="briefTitle"></div>
      <div class="brief-date" id="briefDate"></div>
    </div>
    <div class="pb-section">
      <div class="pb-section-label">Problem Statement</div>
      <div class="pb-section-content" id="problemSection"></div>
    </div>
    <div class="pb-section">
      <div class="pb-section-label">Key Developments</div>
      <div class="pb-section-content" id="developmentsSection"></div>
    </div>
    <div class="pb-section">
      <div class="pb-section-label">Stakeholders Affected</div>
      <div class="pb-section-content" id="stakeholdersSection"></div>
    </div>
    <div class="pb-section">
      <div class="pb-section-label">Policy Recommendations</div>
      <div class="pb-section-content" id="recommendationsSection"></div>
    </div>
    <div class="pb-sources">
      <div class="pb-sources-label">Sources (Live Headlines)</div>
      <div id="sourcesSection"></div>
    </div>
    <button class="pb-copy-btn" onclick="copyBrief()">📋 Copy Brief</button>
  </div>

  <div class="pb-note">
    <strong>Note:</strong> This tool fetches live headlines via a secure proxy. Powered by <a href="https://newsdata.io" target="_blank">NewsData.io</a>.
  </div>
</div>

<script>
async function generateBrief() {
  const topic = document.getElementById('topicInput').value.trim();
  if (!topic) { showError('Please enter a policy topic.'); return; }
  const btn = document.getElementById('generateBtn');
  btn.disabled = true;
  setStatus('Fetching live headlines...');
  hideError();
  document.getElementById('briefBox').classList.remove('visible');
  try {
    const url = `https://policy-brief-api.vercel.app/api/news?topic=${encodeURIComponent(topic)}`;
    const res = await fetch(url);
    const data = await res.json();
    if (data.status !== 'success' || !data.results || data.results.length === 0) {
      showError('No headlines found. Try a broader term.');
      btn.disabled = false; setStatus(''); return;
    }
    setStatus('Building brief...');
    buildBrief(topic, data.results.slice(0, 6));
  } catch (e) {
    showError('Failed to fetch news. Please try again.');
  }
  btn.disabled = false; setStatus('');
}

function buildBrief(topic, articles) {
  const today = new Date().toLocaleDateString('en-IN', { day:'numeric', month:'long', year:'numeric' });
  document.getElementById('briefTitle').textContent = toTitleCase(topic);
  document.getElementById('briefDate').textContent = 'Generated: ' + today;
  document.getElementById('problemSection').textContent =
    `${toTitleCase(topic)} has emerged as a critical policy area in India, with recent developments highlighting the need for structured intervention. ` +
    (articles[0]?.description || articles[0]?.title || '');
  const devList = document.createElement('ul');
  articles.slice(0, 4).forEach(a => {
    const li = document.createElement('li'); li.textContent = a.title; devList.appendChild(li);
  });
  const devSection = document.getElementById('developmentsSection');
  devSection.innerHTML = ''; devSection.appendChild(devList);
  document.getElementById('stakeholdersSection').innerHTML = `<ul>
    <li>Central & State Government Ministries</li>
    <li>Local Bodies and Municipal Authorities</li>
    <li>Citizens and Civil Society Organisations</li>
    <li>Private Sector and Industry Players</li>
    <li>International Development Partners (World Bank, UN agencies)</li>
  </ul>`;
  document.getElementById('recommendationsSection').innerHTML = `<ul>
    <li>Conduct a comprehensive needs assessment involving all stakeholders.</li>
    <li>Establish a dedicated inter-ministerial task force for ${toTitleCase(topic)}.</li>
    <li>Allocate targeted budget under relevant Central/State schemes.</li>
    <li>Introduce a transparent monitoring and evaluation framework.</li>
    <li>Engage civil society for grassroots feedback and implementation oversight.</li>
  </ul>`;
  const srcDiv = document.getElementById('sourcesSection'); srcDiv.innerHTML = '';
  articles.forEach(a => {
    const d = document.createElement('div'); d.className = 'pb-source-item';
    d.innerHTML = `<a href="${a.link}" target="_blank">${a.title}</a> <span style="opacity:0.5">— ${a.source_id || 'News'}</span>`;
    srcDiv.appendChild(d);
  });
  document.getElementById('briefBox').classList.add('visible');
}

function copyBrief() {
  const title = document.getElementById('briefTitle').textContent;
  const problem = document.getElementById('problemSection').textContent;
  const devs = [...document.getElementById('developmentsSection').querySelectorAll('li')].map(l => '• ' + l.textContent).join('\n');
  const recs = [...document.getElementById('recommendationsSection').querySelectorAll('li')].map(l => '• ' + l.textContent).join('\n');
  const text = `POLICY BRIEF: ${title}\n\nPROBLEM STATEMENT\n${problem}\n\nKEY DEVELOPMENTS\n${devs}\n\nRECOMMENDATIONS\n${recs}`;
  navigator.clipboard.writeText(text).then(() => alert('Brief copied to clipboard!'));
}

function toTitleCase(str) { return str.replace(/\w\S*/g, t => t.charAt(0).toUpperCase() + t.substr(1)); }
function setStatus(msg) { document.getElementById('statusMsg').textContent = msg; }
function showError(msg) { const e = document.getElementById('errorMsg'); e.textContent = msg; e.style.display = 'block'; }
function hideError() { document.getElementById('errorMsg').style.display = 'none'; }
</script>
