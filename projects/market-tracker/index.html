<style>
.mt-wrap { max-width: 860px; margin: 0 auto; padding: 1rem 0 3rem; }
.mt-subtitle { font-size: 0.95rem; color: var(--text-muted-color); margin-bottom: 2rem; }
.mt-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.2rem; margin-bottom: 2rem; }
.mt-card {
  border: 1.5px solid var(--border-color); border-radius: 12px;
  padding: 1.2rem 1.4rem; background: var(--card-bg);
  transition: border-color 0.2s, transform 0.2s;
}
.mt-card:hover { border-color: #3b6cf8; transform: translateY(-2px); }
.mt-card-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-muted-color); margin-bottom: 0.5rem; }
.mt-card-price { font-size: 1.6rem; font-weight: 700; color: var(--text-color); margin-bottom: 0.25rem; }
.mt-card-change { font-size: 0.85rem; font-weight: 600; }
.mt-card-change.up { color: #16a34a; }
.mt-card-change.down { color: #dc2626; }
.mt-card-sub { font-size: 0.75rem; color: var(--text-muted-color); margin-top: 0.2rem; }
.mt-chart-box {
  border: 1.5px solid var(--border-color); border-radius: 12px;
  padding: 1.2rem 1.4rem; background: var(--card-bg); margin-bottom: 1.2rem;
}
.mt-chart-title { font-size: 0.85rem; font-weight: 700; color: var(--text-color); margin-bottom: 0.75rem; }
.mt-updated { font-size: 0.75rem; color: var(--text-muted-color); margin-top: 1rem; }
.mt-note {
  font-size: 0.8rem; color: var(--text-muted-color); margin-top: 1.5rem;
  padding: 0.75rem 1rem; background: var(--highlight-bg);
  border-radius: 8px; border: 1px solid var(--border-color);
}
.mt-badge {
  display: inline-block; font-size: 0.65rem; font-weight: 700;
  padding: 0.15rem 0.45rem; border-radius: 4px;
  background: #fef3c7; color: #92400e; margin-left: 0.4rem; vertical-align: middle;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<div class="mt-wrap">
  <p class="mt-subtitle">Live prices and 7-day trends for Indian markets and Gold.</p>
  <div class="mt-grid" id="mtCards"></div>
  <div id="mtCharts">
    <div class="mt-chart-box">
      <div class="mt-chart-title">Nifty 50 — 7 Day Trend</div>
      <canvas id="chartNifty" height="80"></canvas>
    </div>
    <div class="mt-chart-box">
      <div class="mt-chart-title">Sensex — 7 Day Trend</div>
      <canvas id="chartSensex" height="80"></canvas>
    </div>
    <div class="mt-chart-box">
      <div class="mt-chart-title">Gold (INR/10g) — 7 Day Trend</div>
      <canvas id="chartGold" height="80"></canvas>
    </div>
  </div>
  <div class="mt-updated" id="mtUpdated"></div>
  <div class="mt-note">
    <strong>Note:</strong> Prices are indicative. Not financial advice.
  </div>
</div>

<script>
// Static data — update these numbers weekly
const DATA = {
  nifty: {
    label: 'Nifty 50', unit: '₹',
    prices: [22150, 22380, 22290, 22510, 22640, 22480, 22720],
    dates:  ['Mar 13','Mar 14','Mar 15','Mar 16','Mar 17','Mar 18','Mar 21']
  },
  sensex: {
    label: 'Sensex', unit: '₹',
    prices: [73100, 73580, 73290, 73810, 74020, 73750, 74250],
    dates:  ['Mar 13','Mar 14','Mar 15','Mar 16','Mar 17','Mar 18','Mar 21']
  },
  gold: {
    label: 'Gold (INR/10g)', unit: '₹',
    prices: [85200, 85600, 85400, 86100, 86400, 86200, 86800],
    dates:  ['Mar 13','Mar 14','Mar 15','Mar 16','Mar 17','Mar 18','Mar 21']
  }
};

const COLORS = { nifty: '#3b6cf8', sensex: '#8b5cf6', gold: '#f59e0b' };
const charts = {};

function isDark() {
  return document.documentElement.getAttribute('data-mode') === 'dark';
}

function makeChart(id, labels, data, color) {
  const gridColor = isDark() ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.06)';
  const textColor = isDark() ? '#8a8680' : '#6b6b6b';
  if (charts[id]) charts[id].destroy();
  charts[id] = new Chart(document.getElementById(id), {
    type: 'line',
    data: {
      labels,
      datasets: [{
        data, borderColor: color,
        backgroundColor: color + '22',
        borderWidth: 2, pointRadius: 3,
        fill: true, tension: 0.35
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { color: gridColor }, ticks: { color: textColor, font: { size: 11 } } },
        y: { grid: { color: gridColor }, ticks: { color: textColor, font: { size: 11 },
          callback: v => '₹' + v.toLocaleString('en-IN') } }
      }
    }
  });
}

function renderCards(isLive) {
  const ids = ['nifty', 'sensex', 'gold'];
  const chartIds = ['chartNifty', 'chartSensex', 'chartGold'];
  let html = '';
  ids.forEach((key, i) => {
    const d = DATA[key];
    const latest = d.prices[d.prices.length - 1];
    const prev   = d.prices[d.prices.length - 2] || latest;
    const change = latest - prev;
    const pct    = ((change / prev) * 100).toFixed(2);
    const dir    = change >= 0 ? 'up' : 'down';
    const arrow  = change >= 0 ? '▲' : '▼';
    const badge  = isLive ? '' : '<span class="mt-badge">Indicative</span>';
    html += `<div class="mt-card">
      <div class="mt-card-label">${d.label}${badge}</div>
      <div class="mt-card-price">${d.unit}${latest.toLocaleString('en-IN')}</div>
      <div class="mt-card-change ${dir}">${arrow} ${Math.abs(change).toLocaleString('en-IN')} (${Math.abs(pct)}%)</div>
      <div class="mt-card-sub">vs previous close</div>
    </div>`;
    makeChart(chartIds[i], d.dates, d.prices, COLORS[key]);
  });
  document.getElementById('mtCards').innerHTML = html;
  document.getElementById('mtUpdated').textContent =
    (isLive ? '✓ Live data' : '⚠ Showing indicative data') +
    ' · ' + new Date().toLocaleTimeString('en-IN');
}

// Show static data immediately — no loading state
renderCards(false);

// Then silently try to fetch live data in background
async function tryLive() {
  const proxies = [
    'https://corsproxy.io/?',
    'https://api.codetabs.com/v1/proxy?quest='
  ];
  const symbols = {
    nifty:  '^NSEI',
    sensex: '^BSESN',
    gold:   'XAUINR'
  };
  let anySuccess = false;
  for (const [key, sym] of Object.entries(symbols)) {
    for (const proxy of proxies) {
      try {
        const url = proxy + encodeURIComponent(`https://stooq.com/q/d/l/?s=${sym}&i=d`);
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 6000);
        const res = await fetch(url, { signal: controller.signal });
        clearTimeout(timer);
        const text = await res.text();
        if (!text.includes(',') || text.includes('No data')) continue;
        const lines = text.trim().split('\n').slice(1).slice(-8);
        const rows = lines.map(l => {
          const cols = l.split(',');
          return { date: cols[0]?.slice(5), close: parseFloat(cols[4]) };
        }).filter(r => r.date && !isNaN(r.close));
        if (rows.length > 2) {
          DATA[key].prices = rows.map(r => r.close);
          DATA[key].dates  = rows.map(r => r.date);
          anySuccess = true;
          break;
        }
      } catch(e) { continue; }
    }
  }
  if (anySuccess) renderCards(true);
}

tryLive();
</script>
