<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Intelligence Dashboard | Shivanshu Sharma</title>
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { 
                        primary: 'var(--text-primary)', 
                        secondary: 'var(--text-secondary)', 
                        accent: 'var(--accent-color)',
                        bgColor: 'var(--bg-color)',
                        cardBg: 'var(--card-bg)',
                        borderColor: 'var(--border-color)',
                        navBg: 'var(--nav-bg)'
                    }
                }
            }
        }
    </script>
    <style>
        body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        :root {
            --bg-color: #f9fafb;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --border-color: #e5e7eb;
            --accent-color: #3b82f6;
            --nav-bg: rgba(255, 255, 255, 0.8);
        }
        html.dark {
            --bg-color: #18181b;
            --card-bg: #27272a;
            --text-primary: #f4f4f5;
            --text-secondary: #d4d4d8;
            --border-color: #3f3f46;
            --accent-color: #2dd4bf;
            --nav-bg: rgba(24, 24, 27, 0.8);
        }
        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
            </style>
</head>
<body class="bg-bgColor text-primary flex flex-col min-h-screen">
    <!-- Header -->
    <header class="sticky top-0 z-50 w-full backdrop-blur-md bg-navBg border-b border-borderColor">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <a href="../../index.html" class="text-xl font-bold tracking-tight text-primary hover:text-accent transition-colors">Shivanshu Sharma</a>
            <nav class="flex gap-6 items-center">
                <a href="../../index.html" class="text-sm font-medium transition-colors hover:text-accent text-secondary">Home</a>
                <a href="../../projects/index.html" class="text-sm font-medium transition-colors hover:text-accent text-accent">Projects</a>
                <a href="../../about.html" class="text-sm font-medium transition-colors hover:text-accent text-secondary">About</a>
                <button id="themeToggle" class="ml-4 p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors text-secondary">
                    <svg id="themeIconLight" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"/></svg>
                    <svg id="themeIconDark" class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/></svg>
                </button>
            </nav>
        </div>
    </header>

    <main class="flex-grow max-w-6xl mx-auto px-4 sm:px-6 py-12 w-full">
        <a href="../index.html" class="inline-flex items-center text-sm font-medium text-secondary hover:text-accent mb-8 transition-colors">
            <svg class="mr-2 w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Back to Projects
        </a>

        <div class="mb-10 text-center">
            <h1 class="text-4xl font-extrabold tracking-tight text-primary mb-4">Global Intelligence Dashboard</h1>
            <p class="text-lg text-secondary max-w-2xl mx-auto">Real-time tracking of geopolitical developments, national events, and strategic intelligence.</p>
            <p class="text-xs text-secondary mt-4 font-mono tracking-wider uppercase">Last Updated: <span id="lastUpdated" class="font-bold text-accent">Fetching...</span></p>
        </div>

        <!-- Controls -->
        <div class="bg-cardBg p-4 rounded-xl border border-borderColor shadow-sm flex flex-col md:flex-row gap-4 mb-8">
            <div class="flex-1 flex gap-2 overflow-x-auto pb-2 md:pb-0">
                <button onclick="setMode('international')" id="btn-international" class="filter-btn px-4 py-2 rounded-lg text-sm font-medium bg-accent text-white transition-colors whitespace-nowrap shadow-sm">Global News</button>
                <button onclick="setMode('national')" id="btn-national" class="filter-btn px-4 py-2 rounded-lg text-sm font-medium bg-gray-100 dark:bg-gray-800 text-secondary hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors whitespace-nowrap">National News</button>
                <button onclick="setMode('digest')" id="btn-digest" class="filter-btn px-4 py-2 rounded-lg text-sm font-medium bg-gray-100 dark:bg-gray-800 text-secondary hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors whitespace-nowrap">📝 Daily Digest</button>
            </div>
            
            <div class="flex items-center gap-3">
                <label class="text-sm font-medium text-secondary whitespace-nowrap">Filter Date:</label>
                <select id="dateFilter" class="bg-bgColor border border-borderColor text-primary text-sm rounded-lg focus:ring-accent focus:border-accent block w-full p-2 outline-none">
                    <option value="All">All Dates</option>
                </select>
            </div>
        </div>

        <!-- News Grid View -->
        <div id="grid-view">
            <div id="newsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Populated by JS -->
            </div>
            <div id="loadingState" class="flex justify-center py-20 hidden">
                <svg class="animate-spin h-8 w-8 text-accent" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            </div>
        </div>
        
        <!-- Daily Digest View -->
        <div id="digest-view" class="hidden">
            
            
            <div class="overflow-x-auto pb-10">
                <div id="pdf-report">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="mt-auto border-t border-borderColor bg-cardBg py-8">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <p class="text-sm text-secondary">© <span id="footerYear"></span> Shivanshu Sharma. All rights reserved.</p>
            <div class="flex gap-4 items-center">
                <a href="https://23022000.goatcounter.com/" target="_blank" rel="noopener" class="opacity-70 hover:opacity-100 transition-opacity mr-2">
                    <img src="https://23022000.goatcounter.com/count?p=/&t=portfolio" width="auto" height="26" alt="Views">
                </a>
            </div>
        </div>
    </footer>

    <!-- Theme Script -->
    <script>
        const html = document.documentElement;
        const themeToggle = document.getElementById('themeToggle');
        const themeIconLight = document.getElementById('themeIconLight');
        const themeIconDark = document.getElementById('themeIconDark');
        
        function setTheme(isDark) {
            if (isDark) {
                html.classList.add('dark');
                themeIconLight.classList.remove('hidden');
                themeIconDark.classList.add('hidden');
                localStorage.setItem('theme', 'dark');
            } else {
                html.classList.remove('dark');
                themeIconLight.classList.add('hidden');
                themeIconDark.classList.remove('hidden');
                localStorage.setItem('theme', 'light');
            }
        }
        if (localStorage.getItem('theme') === 'dark') { setTheme(true); } else { setTheme(false); }
        if (themeToggle) { themeToggle.addEventListener('click', () => { setTheme(!html.classList.contains('dark')); }); }
        
        document.getElementById('footerYear').textContent = new Date().getFullYear();
    </script>
    <script data-goatcounter="https://23022000.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>

    <!-- App Logic -->
    <script>
        let allStories = [];
        let currentMode = 'international';
        let currentPage = 1;
        const itemsPerPage = 30;
        
        const grid = document.getElementById('newsGrid');
        const loading = document.getElementById('loadingState');
        const dateFilter = document.getElementById('dateFilter');
        
        dateFilter.addEventListener('change', () => { currentPage = 1; renderUI(); });

        function formatDate(dateStr) {
            const d = new Date(dateStr);
            if (isNaN(d)) return dateStr;
            const options = { day: 'numeric', month: 'short', year: 'numeric' };
            return d.toLocaleDateString('en-GB', options); 
        }

        async function init() {
            loading.classList.remove('hidden');
            grid.innerHTML = '';
            try {
                const response = await fetch('./data/news.json');
                const data = await response.json();
                
                if (Array.isArray(data)) {
                    allStories = data;
                } else {
                    allStories = data.stories;
                    const date = new Date(data.generated_at);
                    document.getElementById('lastUpdated').textContent = date.toLocaleString();
                }
                
                allStories = allStories.filter(s => s.section !== 'UP_Focus' && s.report_category !== 'UP_Focus');
                
                populateDateDropdown();
                renderUI();
            } catch(e) {
                console.error(e);
                grid.innerHTML = '<p class="col-span-full text-center text-red-500">Failed to fetch intelligence data. The backend might be unreachable.</p>';
            } finally {
                loading.classList.add('hidden');
            }
        }
        
        function setMode(mode) {
            currentMode = mode;
            currentPage = 1;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.id === `btn-${mode}`) {
                    btn.className = "filter-btn px-4 py-2 rounded-lg text-sm font-medium bg-accent text-white transition-colors whitespace-nowrap shadow-sm";
                } else {
                    btn.className = "filter-btn px-4 py-2 rounded-lg text-sm font-medium bg-gray-100 dark:bg-gray-800 text-secondary hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors whitespace-nowrap";
                }
            });
            renderUI();
        }
        
        function populateDateDropdown() {
            const dates = [...new Set(allStories.map(s => s.date))].sort().reverse();
            dates.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d;
                opt.textContent = formatDate(d);
                dateFilter.appendChild(opt);
            });
            if(dates.length > 0) dateFilter.value = dates[0];
        }
        
        function renderUI() {
            if(currentMode === 'digest') {
                document.getElementById('grid-view').classList.add('hidden');
                document.getElementById('digest-view').classList.remove('hidden');
                renderDigest();
            } else {
                document.getElementById('digest-view').classList.add('hidden');
                document.getElementById('grid-view').classList.remove('hidden');
                renderGrid();
            }
        }

        function renderGrid() {
            const selectedDate = dateFilter.value;
            let filtered = allStories.filter(s => {
                let matchesMode = false;
                if (currentMode === 'international' && s.section === 'International') matchesMode = true;
                if (currentMode === 'national' && s.section === 'National') matchesMode = true;
                let matchesDate = selectedDate === 'All' || s.date === selectedDate;
                return matchesMode && matchesDate;
            });
            
            grid.innerHTML = '';
            
            // Remove old pagination if exists
            const oldPag = document.getElementById('paginationControls');
            if(oldPag) oldPag.remove();
            
            if (filtered.length === 0) {
                grid.innerHTML = '<p class="col-span-full text-center text-secondary py-10">No intelligence reports found for the selected criteria.</p>';
                return;
            }
            
            const totalPages = Math.ceil(filtered.length / itemsPerPage);
            const paginated = filtered.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);
            
            paginated.forEach(story => {
                const card = document.createElement('div');
                card.className = "bg-cardBg rounded-xl border border-borderColor overflow-hidden shadow-sm hover:shadow-md transition-shadow flex flex-col h-full";
                
                card.innerHTML = `
                    <div class="p-6 flex-grow flex flex-col">
                        <div class="flex justify-between items-start mb-3">
                            <span class="text-xs font-bold uppercase tracking-wider text-accent bg-blue-50 dark:bg-blue-900/30 px-2 py-1 rounded">${story.source || 'Intel Source'}</span>
                            <span class="text-xs text-secondary font-medium">${formatDate(story.date)}</span>
                        </div>
                        <h3 class="text-lg font-bold text-primary mb-3 leading-snug"><a href="${story.link}" target="_blank" class="hover:text-accent transition-colors">${story.title}</a></h3>
                        <p class="text-secondary text-sm leading-relaxed flex-grow line-clamp-3">${story.summary || ''}</p>
                    </div>
                    <div class="px-6 py-4 bg-gray-50 dark:bg-gray-800/50 border-t border-borderColor mt-auto">
                        <a href="${story.link}" target="_blank" class="text-sm font-medium text-accent hover:underline flex items-center">
                            Read Full Report
                            <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                        </a>
                    </div>
                `;
                grid.appendChild(card);
            });

            // Add Pagination Controls
            if (totalPages > 1) {
                const pagContainer = document.createElement('div');
                pagContainer.id = 'paginationControls';
                pagContainer.className = "flex justify-center items-center mt-12 gap-4 col-span-full";
                
                const prevBtn = document.createElement('button');
                prevBtn.className = `px-4 py-2 rounded-lg font-medium transition-colors ${currentPage === 1 ? 'bg-gray-100 dark:bg-gray-800 text-gray-400 cursor-not-allowed' : 'bg-cardBg border border-borderColor text-primary hover:bg-gray-100 dark:hover:bg-gray-800 shadow-sm'}`;
                prevBtn.textContent = "Previous";
                prevBtn.disabled = currentPage === 1;
                prevBtn.onclick = () => { if(currentPage > 1) { currentPage--; renderGrid(); window.scrollTo({top: 0, behavior: 'smooth'}); } };
                
                const pageInfo = document.createElement('span');
                pageInfo.className = "text-sm font-medium text-secondary";
                pageInfo.textContent = `Page ${currentPage} of ${totalPages}`;
                
                const nextBtn = document.createElement('button');
                nextBtn.className = `px-4 py-2 rounded-lg font-medium transition-colors ${currentPage === totalPages ? 'bg-gray-100 dark:bg-gray-800 text-gray-400 cursor-not-allowed' : 'bg-cardBg border border-borderColor text-primary hover:bg-gray-100 dark:hover:bg-gray-800 shadow-sm'}`;
                nextBtn.textContent = "Next";
                nextBtn.disabled = currentPage === totalPages;
                nextBtn.onclick = () => { if(currentPage < totalPages) { currentPage++; renderGrid(); window.scrollTo({top: 0, behavior: 'smooth'}); } };
                
                pagContainer.appendChild(prevBtn);
                pagContainer.appendChild(pageInfo);
                pagContainer.appendChild(nextBtn);
                
                // Append after grid
                document.getElementById('grid-view').appendChild(pagContainer);
            }
        }
        
                function renderDigest() {
            const selectedDate = dateFilter.value === 'All' ? allStories[0].date : dateFilter.value;
            const dailyNews = allStories.filter(s => s.date === selectedDate);
            const reportDiv = document.getElementById('pdf-report');
            
            if(dailyNews.length === 0) { 
                reportDiv.innerHTML = "<p class='text-primary py-10 text-center'>No data available for this date.</p>"; 
                return; 
            }

            const intl = dailyNews.filter(s => s.section === 'International').slice(0, 10);
            const natGov = dailyNews.filter(s => s.report_category === 'National_Govt').slice(0, 15);
            const opp = dailyNews.filter(s => s.report_category === 'National_Opposition').slice(0, 5);
            const jud = dailyNews.filter(s => s.report_category === 'National_Judicial').slice(0, 5);
            
            // Rebuilding as a strict A4 Page View
            let html = `
                <div class="max-w-[800px] mx-auto bg-white dark:bg-[#1a1b1e] shadow-2xl border border-gray-200 dark:border-gray-800 rounded-sm my-8" style="min-height: 1122px;">
                    <!-- A4 Inner Padding -->
                    <div class="p-10 sm:p-14 md:p-16">
                        
                        <!-- Header -->
                        <div class="text-center border-b-[3px] border-gray-800 dark:border-gray-200 pb-6 mb-10">
                            <h2 class="text-3xl font-black uppercase tracking-widest text-gray-900 dark:text-white mb-2" style="font-family: Georgia, serif;">Daily Intelligence Digest</h2>
                            <p class="text-lg font-bold text-gray-600 dark:text-gray-400">Date: ${formatDate(selectedDate)}</p>
                            <p class="text-xs font-semibold text-gray-400 dark:text-gray-500 tracking-[0.2em] uppercase mt-4">Confidential & Proprietary</p>
                        </div>
            `;
            
            const generateSection = (title, items) => {
                if(items.length === 0) return '';
                
                let sectionHtml = `
                    <div class="mb-10">
                        <h3 class="text-xl font-bold uppercase tracking-wider text-gray-900 dark:text-white border-b border-gray-300 dark:border-gray-700 pb-2 mb-6" style="font-family: Georgia, serif;">
                            ${title}
                        </h3>
                        <ul class="list-disc pl-5 space-y-6 marker:text-accent">
                `;
                
                items.forEach(item => {
                    sectionHtml += `
                            <li class="pl-2">
                                <div class="flex flex-col">
                                    <h4 class="text-base font-bold text-gray-900 dark:text-gray-100 leading-snug mb-2">
                                        ${item.title}
                                    </h4>
                                    <p class="text-sm text-gray-700 dark:text-gray-300 leading-relaxed text-justify mb-2">
                                        ${item.summary || ''}
                                    </p>
                                    <div>
                                        <a href="${item.link}" target="_blank" class="text-xs font-bold uppercase tracking-wider text-accent hover:underline">
                                            [ Source: ${item.source || 'Intel Link'} ]
                                        </a>
                                    </div>
                                </div>
                            </li>
                    `;
                });
                
                sectionHtml += `
                        </ul>
                    </div>
                `;
                return sectionHtml;
            };

            html += generateSection("1. Global / International Updates", intl);
            html += generateSection("2. National: Government Policies & Mandates", natGov);
            html += generateSection("3. Opposition Activity", opp);
            html += generateSection("4. Judicial & Supreme Court Verdicts", jud);
            
            html += `
                        <!-- Footer -->
                        <div class="text-center mt-16 pt-8 border-t border-gray-300 dark:border-gray-700">
                            <p class="text-xs font-bold uppercase tracking-widest text-gray-500">End of Report</p>
                        </div>
                        
                    </div> <!-- End A4 Inner -->
                </div> <!-- End A4 Outer -->
            `;
            
            reportDiv.innerHTML = html;
        }

        
        
        init();
    </script>
</body>
</html>
