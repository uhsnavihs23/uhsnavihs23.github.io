    /* UNIVERSAL THEME VARIABLES */
    :root {
        --bg-color: #f9fafb;
        --card-bg: #ffffff;
        --text-primary: #0f172a;
        --text-secondary: #475569;
        --border-color: #e5e7eb;
        --accent-color: #3b82f6;
        --nav-bg: rgba(255, 255, 255, 0.8);
    }
    html.dark {
        --bg-color: #18181b;
        --card-bg: #27272a;
        --text-primary: #f4f4f5;
        --text-secondary: #d4d4d8;
        --border-color: #3f3f46;
        --accent-color: #2dd4bf;
        --nav-bg: rgba(24, 24, 27, 0.8);
    }
    
    /* GLOBAL OVERRIDES FOR TAILWIND HARDCODED CLASSES */
    html.dark body { background-color: var(--bg-color) !important; color: var(--text-primary) !important; }
    html.dark .bg-white { background-color: var(--card-bg) !important; }
    html.dark .bg-gray-50, html.dark .bg-slate-50 { background-color: var(--bg-color) !important; }
    html.dark .text-gray-900, html.dark .text-gray-800, html.dark .text-slate-900, html.dark .text-slate-800, html.dark .text-black { color: var(--text-primary) !important; }
    html.dark .text-gray-700, html.dark .text-gray-600, html.dark .text-gray-500, html.dark .text-slate-700, html.dark .text-slate-600, html.dark .text-slate-500 { color: var(--text-secondary) !important; }
    html.dark .border-gray-200, html.dark .border-gray-300, html.dark .border-slate-200, html.dark .border-slate-300 { border-color: var(--border-color) !important; }
    
    /* COMPATIBILITY OVERRIDES FOR INLINE STYLES AND CUSTOM CSS (Campus Electricity) */
    html.dark .header, html.dark .intro-card, html.dark .kpi-card, html.dark .chart-card, html.dark .impact-card, html.dark .recommendation-card, html.dark .warning-card { 
        background-color: var(--card-bg) !important; 
        border-color: var(--border-color) !important;
    }
    html.dark .header { background: var(--card-bg) !important; }
    html.dark .header h1, html.dark .header-badge, html.dark h2, html.dark h3, html.dark h4, html.dark .kpi-value, html.dark .rec-title { color: var(--text-primary) !important; }
    html.dark .header p, html.dark p, html.dark .kpi-label, html.dark .rec-description, html.dark .rec-detail-label { color: var(--text-secondary) !important; }
    
    /* OVERRIDES FOR TAILWIND PROSE */
    html.dark .prose h1, html.dark .prose h2, html.dark .prose h3, html.dark .prose h4 { color: var(--text-primary) !important; }
    html.dark .prose p, html.dark .prose li, html.dark .prose span { color: var(--text-secondary) !important; }
    
    /* OVERRIDES FOR HEADER SPECIFICALLY */
    html.dark header.bg-white\/80 { background-color: var(--nav-bg) !important; }
    
    /* ANY ELEMENT WITH WHITE BG IN DARK MODE */
    html.dark [style*="background: white"], html.dark [style*="background-color: white"], html.dark [style*="background-color: #ffffff"] { background-color: var(--card-bg) !important; }
    html.dark [style*="color: #111827"], html.dark [style*="color: #0f172a"] { color: var(--text-primary) !important; }
    html.dark [style*="color: #4b5563"], html.dark [style*="color: #6b7280"] { color: var(--text-secondary) !important; }

    /* DYNAMIC LIGHT-BOX COLOR OVERRIDES FOR DARK THEME */
    html.dark .bg-amber-100, html.dark .bg-amber-50 { background-color: rgba(245, 158, 11, 0.15) !important; color: #fcd34d !important; }
    html.dark .bg-blue-100, html.dark .bg-blue-50 { background-color: rgba(59, 130, 246, 0.15) !important; color: #93c5fd !important; border-color: rgba(59, 130, 246, 0.3) !important; }
    html.dark .bg-emerald-100, html.dark .bg-emerald-50 { background-color: rgba(16, 185, 129, 0.15) !important; color: #6ee7b7 !important; border-color: rgba(16, 185, 129, 0.3) !important; }
    html.dark .bg-gray-100, html.dark .bg-gray-50, html.dark .bg-slate-100, html.dark .bg-slate-50 { background-color: var(--card-bg) !important; color: var(--text-primary) !important; border: 1px solid var(--border-color) !important; }
    html.dark .bg-indigo-100, html.dark .bg-indigo-50 { background-color: rgba(99, 102, 241, 0.15) !important; color: #a5b4fc !important; border-color: rgba(99, 102, 241, 0.3) !important; }
    html.dark .bg-red-100, html.dark .bg-red-50 { background-color: rgba(239, 68, 68, 0.15) !important; color: #fca5a5 !important; border-color: rgba(239, 68, 68, 0.3) !important; }
    html.dark .bg-yellow-100, html.dark .bg-yellow-50 { background-color: rgba(234, 179, 8, 0.15) !important; color: #fde047 !important; border-color: rgba(234, 179, 8, 0.3) !important; }
    html.dark .bg-orange-100, html.dark .bg-orange-50 { background-color: rgba(249, 115, 22, 0.15) !important; color: #fdba74 !important; border-color: rgba(249, 115, 22, 0.3) !important; }

    /* OVERRIDE TEXT COLORS INSIDE DYNAMIC BOXES TO PREVENT CLASHING */

    html.dark .bg-blue-100 *, html.dark .bg-blue-50 * { color: inherit !important; }
    html.dark .bg-emerald-100 *, html.dark .bg-emerald-50 * { color: inherit !important; }
    html.dark .bg-indigo-100 *, html.dark .bg-indigo-50 * { color: inherit !important; }
    html.dark .bg-red-100 *, html.dark .bg-red-50 * { color: inherit !important; }
    html.dark .bg-yellow-100 *, html.dark .bg-yellow-50 * { color: inherit !important; }
    html.dark .bg-orange-100 *, html.dark .bg-orange-50 * { color: inherit !important; }
    html.dark .bg-purple-100 *, html.dark .bg-purple-50 * { color: inherit !important; }
    html.dark .bg-teal-100 *, html.dark .bg-teal-50 * { color: inherit !important; }
    html.dark .bg-green-100 *, html.dark .bg-green-50 * { color: inherit !important; }


    /* DYNAMIC INLINE HEX-COLOR OVERRIDES FOR DARK THEME (e.g. Campus Electricity) */
    html.dark [style*="#dbeafe" i] { background-color: rgba(59, 130, 246, 0.15) !important; border-color: rgba(59, 130, 246, 0.3) !important; color: #93c5fd !important; }

    html.dark [style*="#dbeafe" i] *, html.dark [style*="#f0fdf4" i] *, html.dark [style*="#fefce8" i] *, html.dark [style*="#f3f4f6" i] *, html.dark [style*="#f9fafb" i] * { color: inherit !important; }
    
    /* FIX HOVER STATES FOR THE TABLE/ROWS IN DARK MODE */
    html.dark tr:hover { background-color: rgba(255,255,255,0.05) !important; }


    
    
    
    
    /* GO RETRO BETA FEATURE (Consistent Full-Screen IE6) */
    html.retro body {
        font-family: Tahoma, "Microsoft Sans Serif", sans-serif !important;

    html.retro footer {

    html.retro .bg-cardBg, html.retro .bg-white, html.retro [style*="background-color: var(--card-bg)"] {
        background: #ffffff !important;
        border: 1px solid #000000 !important;
        box-shadow: none !important;
        border-radius: 0 !important;
    }
    
    html.retro button {
        background: #ece9d8 !important;
        border: 2px outset #ffffff !important;
        border-right-color: #aca899 !important;

        border-radius: 0 !important;

                            </div>

            }
            
            // Check local storage immediately
            if (localStorage.getItem('retro') === 'true') { window.setRetro(true); }
            
            // Re-bind all retroToggle buttons just in case
            document.body.addEventListener('click', function(e) {
                if (e.target && e.target.id === 'retroToggle') {
                    window.setRetro(!html.classList.contains('retro'));
                }
            });
        }
        
        // Wait for DOM
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initRetroMode);
        } else {
            initRetroMode();
        }
    </script>
</body>
</html>
