<div class="post-tail-wrapper text-muted">
    <div class="post-tail-bottom d-flex justify-content-between align-items-center mt-5 pb-2">
        <div class="license-wrapper">
            This post is licensed under
            <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>
            by the author.
        </div>
        <div class="share-wrapper d-flex align-items-center">
            <span class="share-label text-muted">Share</span>
            <span class="share-icons">
                <a href="https://twitter.com/intent/tweet?text={{ page.title | url_encode }}%20-%20{{ site.title | url_encode }}&url={{ page.url | absolute_url | url_encode }}"
                    target="_blank" rel="noopener" data-bs-toggle="tooltip" data-bs-placement="top" title="Twitter"
                    aria-label="Twitter">
                    <i class="fa-fw fa-brands fa-square-x-twitter"></i>
                </a>
                <a href="https://www.facebook.com/sharer/sharer.php?title={{ page.title | url_encode }}%20-%20{{ site.title | url_encode }}&u={{ page.url | absolute_url | url_encode }}"
                    target="_blank" rel="noopener" data-bs-toggle="tooltip" data-bs-placement="top" title="Facebook"
                    aria-label="Facebook">
                    <i class="fa-fw fab fa-facebook-square"></i>
                </a>
                <a href="https://t.me/share/url?url={{ page.url | absolute_url | url_encode }}&text={{ page.title | url_encode }}%20-%20{{ site.title | url_encode }}"
                    target="_blank" rel="noopener" data-bs-toggle="tooltip" data-bs-placement="top" title="Telegram"
                    aria-label="Telegram">
                    <i class="fa-fw fab fa-telegram"></i>
                </a>
                <a href="https://www.linkedin.com/sharing/share-offsite/?url={{ page.url | absolute_url | url_encode }}"
                    target="_blank" rel="noopener" data-bs-toggle="tooltip" data-bs-placement="top" title="Linkedin"
                    aria-label="Linkedin">
                    <i class="fa-fw fab fa-linkedin"></i>
                </a>
                <a href="https://wa.me/?text={{ page.title | url_encode }}%20-%20{{ site.title | url_encode }}%20{{ page.url | absolute_url | url_encode }}"
                    target="_blank" rel="noopener" data-bs-toggle="tooltip" data-bs-placement="top" title="WhatsApp"
                    aria-label="WhatsApp">
                    <i class="fa-fw fab fa-whatsapp"></i>
                </a>
                <a href="https://www.reddit.com/submit?url={{ page.url | absolute_url | url_encode }}&title={{ page.title | url_encode }}%20-%20{{ site.title | url_encode }}"
                    target="_blank" rel="noopener" data-bs-toggle="tooltip" data-bs-placement="top" title="Reddit"
                    aria-label="Reddit">
                    <i class="fa-fw fa-brands fa-square-reddit"></i>
                </a>
                <a href="https://www.threads.net/intent/post?text={{ page.title | url_encode }}%20-%20{{ site.title | url_encode }}%20{{ page.url | absolute_url | url_encode }}"
                    target="_blank" rel="noopener" data-bs-toggle="tooltip" data-bs-placement="top" title="Threads"
                    aria-label="Threads">
                    <i class="fa-fw fa-brands fa-square-threads"></i>
                </a>
            </span>
        </div>
    </div>
</div>
