<div class="post-meta text-muted">
  <span>Posted <time data-ts="{{ page.date | date: '%s' }}" data-df="ll">{{ page.date | date: '%b %-d, %Y'
      }}</time></span>
  {% if page.last_modified_at %}
  <span>Updated <time data-ts="{{ page.last_modified_at | date: '%s' }}" data-df="ll">{{ page.last_modified_at | date:
      '%b %-d, %Y' }}</time></span>
  {% endif %}

  <span>By <em><a href="https://uhsnavihs23.github.io">Shivanshu Sharma</a></em></span>

</div>
